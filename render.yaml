services:
  - type: web
    name: mdrrmo-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mdrrmo-postgis
          property: connectionString
      - key: INCIDENT_READ_TOKEN
        generateValue: true
      - key: HATCHABLE_ORIGIN
        value: https://mdrrmo-constituents-nfaq.hatchable.site

databases:
  - name: mdrrmo-postgis
    plan: free
    region: singapore
    databaseName: mdrrmo
    ipAllowList: []
